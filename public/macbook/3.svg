<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#e8e8ed"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eceded"/>
      <stop offset="0.5" stop-color="#d6d8db"/>
      <stop offset="1" stop-color="#c2c4c8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg3)"/>
  <!-- closed lid, top view -->
  <rect x="290" y="200" width="620" height="440" rx="30" fill="url(#lid)" stroke="#b5b7bc" stroke-width="2"/>
  <circle cx="600" cy="420" r="52" fill="#f2f3f4" opacity="0.9"/>
  <circle cx="600" cy="420" r="52" fill="none" stroke="#c9cbcf" stroke-width="2"/>
  <ellipse cx="600" cy="700" rx="360" ry="14" fill="#000" opacity="0.06"/>
  <text x="600" y="780" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" fill="#86868b">Silver aluminium &#183; clean lid, no dents</text>
  <text x="600" y="820" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#b0b0b5">placeholder photo 3 &#8212; closed lid</text>
</svg>
