      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#e8e8ed"/>
    </linearGradient>
    <linearGradient id="alu4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e6e9"/>
      <stop offset="1" stop-color="#c8cacd"/>
