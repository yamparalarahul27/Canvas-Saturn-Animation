  <text x="600" y="720" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" fill="#86868b">15.5 mm thin &#183; 1.6 kg</text>
  <text x="600" y="760" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#b0b0b5">placeholder photo 4 &#8212; side profile</text>
