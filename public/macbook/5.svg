<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#e8e8ed"/>
    </linearGradient>
    <linearGradient id="alu5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eaec"/>
      <stop offset="1" stop-color="#cdcfd3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg5)"/>
  <!-- ports close-up: left edge -->
  <rect x="180" y="330" width="840" height="150" rx="40" fill="url(#alu5)" stroke="#b5b7bc" stroke-width="2"/>
  <!-- MagSafe -->
  <rect x="300" y="385" width="120" height="40" rx="20" fill="#3a3b3f"/>
  <rect x="312" y="397" width="96" height="16" rx="8" fill="#1d1e20"/>
  <!-- USB-C x2 -->
  <rect x="520" y="390" width="84" height="30" rx="15" fill="#2c2d30"/>
  <rect x="660" y="390" width="84" height="30" rx="15" fill="#2c2d30"/>
  <!-- headphone jack -->
  <circle cx="860" cy="405" r="17" fill="#2c2d30"/>
  <g font-family="system-ui, sans-serif" font-size="22" fill="#9a9aa0" text-anchor="middle">
    <text x="360" y="540">MagSafe 3</text>
    <text x="632" y="540">2 &#215; Thunderbolt 4</text>
    <text x="860" y="540">3.5 mm</text>
  </g>
  <text x="600" y="700" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" fill="#86868b">Plus HDMI &#38; SDXC on the right side</text>
  <text x="600" y="740" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#b0b0b5">placeholder photo 5 &#8212; ports</text>
</svg>
